[project]
name = "home-weather-mcp-tests"
version = "0.4.0"
description = "External protocol tests for the Rust weather server"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "certifi>=2026.10.19", "packaging>=24"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
required-version = ">=0.13.4"
