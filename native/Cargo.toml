[package]
name = "home-weather-mcp"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "On-demand bilingual weather MCP server"

[lib]
name = "home_weather_core"

[[bin]]
name = "home-weather-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
unicode-normalization = "0.1"
caseless = "0.2.2"
fs2 = "0.4"
tempfile = "3"
regex = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
