name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      - name: Test Rust core
        run: cargo test --manifest-path native/Cargo.toml --locked --offline
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check security minimums
        run: uv run --frozen python scripts/check_security.py
      - name: Test
        run: uv run --frozen pytest -q
      - name: Build distributions
        run: uv build
      - name: Check release contents
        run: uv run --frozen python scripts/check_dist.py
