name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.13.4'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy && rustup default 1.99.1
      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path native/Cargo.toml --locked
      - name: Check Rust formatting and lints
        run: |
          cargo fmt --manifest-path native/Cargo.toml --check
          cargo clippy --manifest-path native/Cargo.toml --all-targets --locked --offline -- -D warnings
      - name: Build Rust contract test host
        run: cargo build --manifest-path native/Cargo.toml --example contract_server --locked --offline
      - name: Test Rust core
        run: cargo test --manifest-path native/Cargo.toml --locked --offline
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check security minimums
        run: uv run --frozen python scripts/check_security.py
      - name: Test
        run: uv run --frozen pytest -q
      - name: Install standalone executable with explicit host and custom target directory
        shell: bash
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          CARGO_TARGET_DIR="$RUNNER_TEMP/weather-target" cargo install --path native --locked --offline --target "$host" --root .install
          .install/bin/home-weather-mcp --version
          .install/bin/home-weather-mcp --help
      - name: Test installed executable
        run: WEATHER_BINARY="$PWD/.install/bin/home-weather-mcp" uv run --frozen pytest -q
